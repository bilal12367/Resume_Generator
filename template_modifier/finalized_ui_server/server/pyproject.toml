[project]
name = "server"
version = "0.1.0"
description = "FastAPI backend server for ATS resume generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "passlib>=1.7.4",
    "pydantic[email]>=2.13.4",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
    "playwright>=1.40.0",
    "requests>=2.34.2",
    "beautifulsoup4>=4.12.0",
    "llama-index-core>=0.10.0",
    "llama-index-llms-siliconflow>=0.1.0",
    "pyjwt>=2.8.0",
    "selenium>=4.20.0",
    "tiktoken>=0.7.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "app/tests"
]
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]


