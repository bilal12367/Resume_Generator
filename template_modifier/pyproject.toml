[project]
name = "silicon-flow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[all,sqlite]>=1.1.0",
    "aiohttp-cors>=0.8.1",
    "aiokafka>=0.14.0",
    "aiosqlite>=0.21.0",
    "beautifulsoup4>=4.15.0",
    "cent>=5.2.0",
    "centrifuge-python>=0.4.4",
    "confluent-kafka>=2.14.0",
    "dotenv>=0.9.9",
    "fastapi>=0.135.3",
    "iniconfig>=2.3.0",
    "langchain>=1.3.1",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.1",
    "langfuse>=4.3.1",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "llama-agents-server>=0.4.3",
    "llama-index>=0.14.19",
    "llama-index-core>=0.14.20",
    "llama-index-llms-openai-like>=0.7.2",
    "llama-index-llms-siliconflow>=0.5.0",
    "llama-index-storage-chat-store-sqlite>=0.3.0",
    "openai>=2.30.0",
    "openai-agents>=0.17.2",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "pymysql>=1.1.2",
    "pyppeteer>=0.0.25",
    "pyrefly>=1.2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "python-json-logger>=4.1.0",
    "python-logging-loki>=0.3.1",
    "python-socketio>=5.16.1",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.42.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.uv.workspace]
members = [
    "module_testing/job_mcp",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
