upstream job_scraper_backend {
    server job_scraper:8080;
}

upstream centrifugo_backend {
    server centrifugo:8000;
}

server {
    listen 3000;
    server_name _;

    # --- UI Static Files (Vite Build) ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Job Scraper API (strip /api prefix) ---
    location /api/ {
        proxy_pass http://job_scraper_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # --- Static PDF Output Files ---
    location /output/ {
        proxy_pass http://job_scraper_backend/output/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Centrifugo WebSocket ---
    location /ws {
        proxy_pass http://centrifugo_backend/connection/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Centrifugo HTTP API (for server-side publish) ---
    location /centrifugo/api {
        proxy_pass http://centrifugo_backend/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
